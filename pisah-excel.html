<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pisah Excel V8 - Hasilnya Excel Bukan ZIP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
 *{box-sizing:border-box;font-family:Arial,sans-serif} body{margin:0;background:#f4f6f8;padding:12px}
 .card{background:#fff;border-radius:16px;padding:18px;max-width:980px;margin:auto;box-shadow:0 2px 12px rgba(0,0,0,.08)}
 h1{margin:0;font-size:22px} p.sub{color:#666;font-size:13px;margin:6px 0 14px}
 label{font-size:12px;font-weight:bold;display:block;margin-top:12px} select,input{width:100%;padding:12px;margin-top:5px;border:1px solid #ddd;border-radius:9px;font-size:14px;background:#fff}
 .drop{border:2px dashed #2563eb;border-radius:12px;padding:22px;text-align:center;background:#eff6ff;cursor:pointer}
 .btn{width:100%;padding:14px;border:0;border-radius:10px;color:#fff;font-weight:bold;font-size:15px;margin-top:10px;cursor:pointer}
 .green{background:#059669}.blue{background:#2563eb}.orange{background:#ea580c}.gray{background:#6b7280}
 .row{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(max-width:600px){.row{grid-template-columns:1fr}}
 .group{border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
 .dl{background:#059669;color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:bold;white-space:nowrap}
 table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px} th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap} th{background:#f8f8f8}
 .info{background:#e0f2fe;border:1px solid #bae6fd;padding:12px;border-radius:10px;font-size:13px;margin-top:12px}
 .filterBox{background:#f0fdf4;border:2px solid #bbf7d0;padding:14px;border-radius:12px;margin-top:14px}
 .hasilFilter{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px;margin-top:12px}
 .bar{height:8px;background:#eee;border-radius:20px;overflow:hidden;margin-top:8px} .bar i{display:block;height:100%;background:#2563eb;width:0%;transition:.3s}
 .chip{display:inline-block;background:#111;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;margin:2px}
</style>
</head>
<body>
<div class="card">
 <h1>✂️ Pisah Excel V8 - Hasilnya Excel (Bukan ZIP)</h1>
 <p class="sub">Pilih Cabang & Dokter → Download langsung jadi <b>1 file .xlsx</b></p>
 <label>1. Upload File Gabungan (21 Nov - Rekap Komisi Nov 26)</label>
 <div class="drop" onclick="document.getElementById('file').click()"><div style="font-size:30px">📂</div><div id="fileName"><b>Klik untuk pilih file</b><br><small>.xlsx / .csv</small></div><div class="bar"><i id="prog"></i></div><small id="statusTxt" style="color:#666"></small></div>
 <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden onchange="bacaFile(event)">
 <div id="filterSection" style="display:none">
  <div class="filterBox">
   <b style="font-size:16px">🎯 2. Pilih Cabang & Dokter Dulu</b>
   <div class="row">
    <div><label>🏥 Cabang:</label><select id="filterCabang" onchange="onCabangChange(); terapkanFilter()"><option value="SEMUA">-- Semua Cabang --</option></select></div>
    <div><label>📅 Bulan / Periode:</label><select id="filterBulan" onchange="terapkanFilter()"><option value="SEMUA">-- Semua Bulan --</option></select></div>
   </div>
   <label>👩‍⚕️ Dokter:</label><select id="filterDokter" onchange="terapkanFilter()"><option value="SEMUA">-- Semua Dokter --</option></select>
   <label>🔍 Cari Dokter:</label><input id="cariDokter" placeholder="Ketik nama dokter, misal Ihsan..." oninput="filterDokterBySearch()">
   <div style="margin-top:10px"><span id="chipInfo"></span></div>
   <button class="btn gray" onclick="resetFilter()">🔄 Reset Filter</button>
  </div>
  <div id="hasilFilter" class="hasilFilter" style="display:none">
   <b id="judulFilter" style="font-size:16px"></b><br>
   <small id="detailFilter" style="color:#666"></small><br>
   <code id="namaFileFilter" style="background:#111;color:#0f0;padding:4px 8px;border-radius:6px;font-size:12px;display:inline-block;margin-top:6px"></code><br>
   <small id="isiFileInfo" style="color:#666"></small>
   <!-- INI TOMBOL UTAMANYA - HASILNYA EXCEL -->
   <button class="btn green" onclick="downloadExcelRapi()">⬇️ Download Excel Ini (RAPI - Header Kuning + TOTAL)</button>
   <button class="btn orange" onclick="downloadExcelCepat()">⚡ Download Excel Ini (CEPAT)</button>
   <div style="margin-top:12px"><b>Preview (5 baris pertama):</b><div style="overflow-x:auto"><table><thead id="headPreview"></thead><tbody id="bodyPreview"></tbody></table></div></div>
  </div>
  <div id="listPerDokter" style="margin-top:14px"></div>
 </div>
 <p style="text-align:center;color:#999;font-size:11px;margin-top:14px">Hasilnya .xlsx, bukan .zip • Diproses di HP Kakak saja</p>
</div>
<script>
let headers=[], rows=[];
let idx={dokter:-1,cabang:-1,period:-1,komisi:-1,docReff:-1,invoice:-1};
let allCabang=[], allDokter=[], allBulan=[];
function setProg(p,t){document.getElementById('prog').style.width=p+'%';document.getElementById('statusTxt').innerText=t||'';}
const KODE_CABANG={'MAKASSAR':'MKS','MAKASAR':'MKS','PONTIANAK':'PTK','ARTERI':'ARTERI','SINGKAWANG':'SKW','KETAPANG':'KTP'};
function kodeCabang(cabang, invoice){ let c=String(cabang||'').trim().toUpperCase(); if(KODE_CABANG[c]) return KODE_CABANG[c]; let m=String(invoice||'').match(/^[A-Z]-([A-Z]+)-/); if(m) return m[1]; return c.replace(/[^A-Z]/g,'').slice(0,3)||'MKS'; }
function keUnderscore(s){return String(s||'').trim().replace(/['’`]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');}
function bulanInfo(d){ let names=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; let dt=d instanceof Date?d:new Date(d); if(isNaN(dt)){ let m=String(d||'').match(/(\d{4})-(\d{1,2})/); if(m) dt=new Date(m[1],m[2]-1,1); else dt=new Date(); } return {bulan:names[dt.getMonth()], tahun2:String(dt.getFullYear()).slice(-2), tahunFull:String(dt.getFullYear()), key:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')}; }
function bacaFile(e){
  let f=e.target.files[0]; if(!f) return;
  setProg(10,'Membaca '+f.name+'...');
  document.getElementById('fileName').innerHTML='<b>✅ '+f.name+'</b><br><small>Diproses...</small>';
  setTimeout(()=>{
    let r=new FileReader();
    r.onload=function(ev){
      setProg(60,'Mengurai tabel...');
      setTimeout(()=>{
        try{
          let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
          let ws=wb.Sheets[wb.SheetNames[0]];
          let aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});
          let hRow=aoa.findIndex(row=>row.some(c=>String(c).toLowerCase().includes('doctor'))||row.some(c=>String(c).toLowerCase().includes('nama dokter')));
          if(hRow===-1) hRow=0;
          headers=aoa[hRow].map((h,i)=> h?String(h).trim():'kolom_'+(i+1));
          let seen={}; headers=headers.map(h=>{ if(seen[h]){seen[h]++; return h+'_'+seen[h];} seen[h]=1; return h; });
          let findIdx=(...names)=> headers.findIndex(h=> names.some(n=> h.toLowerCase().includes(n)));
          idx.dokter=findIdx('nama dokter','doctor'); idx.cabang=findIdx('branch_name'); idx.period=findIdx('period_month','commission_period'); idx.komisi=findIdx('komisi'); idx.docReff=findIdx('doc_reff'); idx.invoice=findIdx('invoice_number');
          rows=[];
          for(let i=hRow+1;i<aoa.length;i++){ let vals=aoa[i]; if(vals.every(v=>String(v||'').trim()==='')) continue; let teks=vals.join(' ').toLowerCase(); if(teks.includes('total komisi')||teks.includes('sum of komisi')) continue; rows.push(vals); }
          setProg(100,'Selesai! '+rows.length+' baris.');
          document.getElementById('fileName').innerHTML='<b>✅ '+f.name+'</b><br><small>'+rows.length+' baris • Siap pilih!</small>';
          siapkanFilter();
        }catch(err){ alert('Gagal: '+err.message); }
      },50);
    };
    r.readAsArrayBuffer(f);
  },50);
}
function siapkanFilter(){
  let setCabang=new Set(), setDokter=new Set(), setBulan=new Map();
  rows.forEach(r=>{ let cab=String(r[idx.cabang]||'').trim()||'MAKASSAR'; let dok=String(r[idx.dokter]||'').trim()||'Tanpa Dokter'; let info=bulanInfo(idx.period>=0?r[idx.period]:r[0]); setCabang.add(cab); setDokter.add(dok); setBulan.set(info.key, info.bulan+' 20'+info.tahun2); });
  allCabang=[...setCabang].sort(); allDokter=[...setDokter].sort(); allBulan=[...setBulan.entries()].sort();
  document.getElementById('filterCabang').innerHTML='<option value="SEMUA">-- Semua Cabang ('+allCabang.length+') --</option>'+allCabang.map(c=>'<option value="'+c.replace(/"/g,'&quot;')+'">'+c+' ('+kodeCabang(c,'')+')</option>').join('');
  document.getElementById('filterBulan').innerHTML='<option value="SEMUA">-- Semua Bulan --</option>'+allBulan.map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
  isiDokterDropdown(allDokter);
  document.getElementById('filterSection').style.display='block';
  terapkanFilter();
}
function isiDokterDropdown(list){ let sel=document.getElementById('filterDokter'); let cur=sel.value; sel.innerHTML='<option value="SEMUA">-- Semua Dokter ('+list.length+') --</option>'+list.map(d=>'<option value="'+d.replace(/"/g,'&quot;')+'">'+d+'</option>').join(''); if(list.includes(cur)) sel.value=cur; }
function onCabangChange(){ let cab=document.getElementById('filterCabang').value; let listDokter = cab==='SEMUA' ? allDokter : [...new Set(rows.filter(r=> String(r[idx.cabang]||'').trim()===cab).map(r=> String(r[idx.dokter]||'').trim()))].sort(); isiDokterDropdown(listDokter); document.getElementById('filterDokter').value='SEMUA'; }
function filterDokterBySearch(){ let q=document.getElementById('cariDokter').value.toLowerCase().trim(); let cab=document.getElementById('filterCabang').value; let base = cab==='SEMUA' ? allDokter : [...new Set(rows.filter(r=> String(r[idx.cabang]||'').trim()===cab).map(r=> String(r[idx.dokter]||'').trim()))].sort(); let filtered = q ? base.filter(d=> d.toLowerCase().includes(q)) : base; isiDokterDropdown(filtered); if(filtered.length===1) document.getElementById('filterDokter').value=filtered[0]; terapkanFilter(); }
function resetFilter(){ document.getElementById('filterCabang').value='SEMUA'; document.getElementById('filterBulan').value='SEMUA'; document.getElementById('cariDokter').value=''; isiDokterDropdown(allDokter); document.getElementById('filterDokter').value='SEMUA'; terapkanFilter(); }
function rowsTerfilter(){
  let cab=document.getElementById('filterCabang').value; let dok=document.getElementById('filterDokter').value; let bln=document.getElementById('filterBulan').value;
  return rows.filter(r=>{
    if(cab!=='SEMUA' && String(r[idx.cabang]||'').trim()!==cab) return false;
    if(dok!=='SEMUA' && String(r[idx.dokter]||'').trim()!==dok) return false;
    if(bln!=='SEMUA'){ let info=bulanInfo(idx.period>=0?r[idx.period]:r[0]); if(info.key!==bln) return false; }
    return true;
  });
}
function namaFileExcel(){
  let cab=document.getElementById('filterCabang').value; let dok=document.getElementById('filterDokter').value; let bln=document.getElementById('filterBulan').value;
  let filtered=rowsTerfilter();
  if(dok!=='SEMUA' && filtered.length){
    let r0=filtered[0]; let kode=kodeCabang(String(r0[idx.cabang]||'').trim(), r0[idx.invoice]); let info=bulanInfo(idx.period>=0?r0[idx.period]:r0[0]);
    return 'Komisi_Dokter_'+kode+'_'+info.bulan+'_'+info.tahun2+'_'+keUnderscore(dok);
  }
  let kode = cab!=='SEMUA' ? kodeCabang(cab,'') : 'Semua_Cabang';
  let blnLabel = bln!=='SEMUA' ? (()=>{ let info=bulanInfo(bln+'-01'); return info.bulan+'_'+info.tahun2; })() : 'Semua_Bulan';
  let dokLabel = dok!=='SEMUA' ? keUnderscore(dok) : 'Semua_Dokter';
  return 'Komisi_Dokter_'+kode+'_'+blnLabel+'_'+dokLabel;
}
function terapkanFilter(){
  let filtered=rowsTerfilter();
  let cab=document.getElementById('filterCabang').value; let dok=document.getElementById('filterDokter').value; let bln=document.getElementById('filterBulan').value;
  document.getElementById('chipInfo').innerHTML = (cab!=='SEMUA'?'<span class="chip">🏥 '+cab+'</span>':'')+(dok!=='SEMUA'?'<span class="chip">👩‍⚕️ '+dok+'</span>':'')+(bln!=='SEMUA'?'<span class="chip">📅 '+bln+'</span>':'');
  if(!filtered.length){ document.getElementById('hasilFilter').style.display='block'; document.getElementById('judulFilter').innerText='😢 Tidak ada data'; document.getElementById('detailFilter').innerText='Coba ganti filter.'; document.getElementById('namaFileFilter').innerText=''; document.getElementById('isiFileInfo').innerText=''; document.getElementById('listPerDokter').innerHTML=''; return; }
  let totalKomisi=0; filtered.forEach(r=>{ totalKomisi+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; });
  let perDokter={}; filtered.forEach(r=>{ let d=String(r[idx.dokter]||'').trim()||'Tanpa Dokter'; if(!perDokter[d]) perDokter[d]=[]; perDokter[d].push(r); });
  let judul = dok!=='SEMUA' ? '👩‍⚕️ '+dok : (cab!=='SEMUA' ? '🏥 Cabang '+cab : '📊 Semua Data');
  if(bln!=='SEMUA') judul += ' • '+bln;
  document.getElementById('hasilFilter').style.display='block';
  document.getElementById('judulFilter').innerText=judul;
  document.getElementById('detailFilter').innerText=filtered.length+' baris • '+Object.keys(perDokter).length+' dokter • Total Komisi: Rp '+totalKomisi.toLocaleString('id-ID');
  document.getElementById('namaFileFilter').innerText='📄 '+namaFileExcel()+'.xlsx';
  // Penjelasan isi file Excel-nya
  if(dok!=='SEMUA'){
    document.getElementById('isiFileInfo').innerText='Isi file Excel ini: 1 Sheet aja, isinya dokter '+dok+' (header kuning + TOTAL + rekap bawah, persis contoh).';
  } else {
    document.getElementById('isiFileInfo').innerText='Isi file Excel ini: 1 file Excel dengan '+ (Object.keys(perDokter).length+1) +' Sheet → Sheet REKAP di depan + 1 Sheet per dokter ('+Object.keys(perDokter).sort().slice(0,3).join(', ')+'...). Buka 1 file, pindah-pindah Sheet di bawah.';
  }
  document.getElementById('headPreview').innerHTML='<tr>'+headers.slice(0,8).map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  document.getElementById('bodyPreview').innerHTML=filtered.slice(0,5).map(r=>'<tr>'+r.slice(0,8).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  let html='<b>📋 Daftar dokter di filter ini (klik untuk download Excel 1 dokter itu aja):</b>';
  Object.keys(perDokter).sort().forEach(d=>{
    let arr=perDokter[d]; let tk=0; arr.forEach(r=>{ tk+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; });
    html+='<div class="group"><div><b>'+d+'</b><br><small>'+arr.length+' baris • Rp '+tk.toLocaleString('id-ID')+'</small></div><button class="dl" onclick="downloadSatuDokterExcel(\''+d.replace(/'/g,"\\'")+'\')">⬇️ Excel</button></div>';
  });
  document.getElementById('listPerDokter').innerHTML=html;
}
// === DOWNLOAD CEPAT: 1 FILE EXCEL, BANYAK SHEET (kalau banyak dokter) ===
function downloadExcelCepat(){
  let filtered=rowsTerfilter(); if(!filtered.length) return alert('Tidak ada data!');
  let dok=document.getElementById('filterDokter').value;
  let wb=XLSX.utils.book_new();
  if(dok!=='SEMUA'){
    // 1 dokter = 1 sheet Data
    let aoa=[headers, ...filtered];
    let totalKomisi=0; filtered.forEach(r=>{ totalKomisi+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; });
    let totalRow=new Array(headers.length).fill(''); totalRow[22]='Total Komisi'; totalRow[23]=totalKomisi;
    aoa.push(totalRow);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Data');
  } else {
    // Banyak dokter = REKAP + 1 sheet per dokter
    let perDokter={}; filtered.forEach(r=>{ let d=String(r[idx.dokter]||'').trim(); if(!perDokter[d]) perDokter[d]=[]; perDokter[d].push(r); });
    let rekap=Object.keys(perDokter).sort().map(d=>{ let arr=perDokter[d]; let tk=0; arr.forEach(r=>{ tk+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; }); let r0=arr[0]; return {Dokter:d, Cabang:String(r0[idx.cabang]||''), Jumlah_Baris:arr.length, Total_Komisi:tk}; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rekap), 'REKAP');
    Object.keys(perDokter).sort().forEach(d=>{
      let arr=perDokter[d]; let aoa=[headers, ...arr];
      let tk=0; arr.forEach(r=>{ tk+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; });
      let totalRow=new Array(headers.length).fill(''); totalRow[22]='Total Komisi'; totalRow[23]=tk;
      aoa.push(totalRow);
      // Nama sheet max 31 karakter, tidak boleh / \ ? * [ ]
      let sheetName = d.replace(/[\/\\?*\[\]]/g,'-').substring(0,31);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sheetName);
    });
  }
  XLSX.writeFile(wb, namaFileExcel()+'.xlsx');
}
// === DOWNLOAD RAPI: 1 FILE EXCEL, HEADER KUNING + RUMUS TOTAL ===
function isiSheetRapi(ws, arrRows, meta){
  let widths=[17.2,13.5,15.9,19,11.8,13.7,27.5,9.7,10.9,36.3,8.4,12.8,18.4,27.9,24.6,10.5,60,18.1,10,32.4,35.5,10.9,17.2,16];
  widths.forEach((w,i)=>{ ws.getColumn(i+1).width=w; });
  let hr=ws.getRow(1); headers.forEach((h,i)=>{ let c=hr.getCell(i+1); c.value=h; c.font={name:'Calibri',size:11,bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}}; });
  arrRows.forEach((vals,ri)=>{ let row=ws.getRow(ri+2); vals.forEach((v,ci)=>{ row.getCell(ci+1).value=v; }); row.getCell(11).numFmt='#,##0'; row.getCell(12).numFmt='#,##0'; row.getCell(13).numFmt='#,##0'; row.getCell(14).numFmt='0%'; row.getCell(21).numFmt='#,##0'; row.getCell(24).numFmt='_-"Rp"* #,##0_-;-\"Rp\"* #,##0_-;_-\"Rp\"* \"-\"_-;_-@_-'; });
  let lastDataRow=arrRows.length+1; let totalRow=lastDataRow+1;
  let tr=ws.getRow(totalRow); tr.getCell(23).value='Total Komisi'; tr.getCell(23).font={bold:true}; tr.getCell(24).value={formula:'SUM(X2:X'+lastDataRow+')'}; tr.getCell(24).numFmt='_-"Rp"* #,##0_-;-\"Rp\"* #,##0_-;_-\"Rp\"* \"-\"_-;_-@_-'; tr.getCell(24).font={bold:true};
  let ph=ws.getRow(totalRow+2); ph.getCell(20).value='branch_name'; ph.getCell(21).value='IDTM'; ph.getCell(22).value='NRP'; ph.getCell(23).value='DOC NAME 2'; ph.getCell(24).value='SUM of komisi'; for(let i=20;i<=24;i++) ph.getCell(i).font={bold:true};
  let pd=ws.getRow(totalRow+3); pd.getCell(20).value=meta?meta.cabang:''; pd.getCell(21).value=meta?meta.docReff:''; pd.getCell(22).value=''; pd.getCell(23).value=meta?meta.dokter.toUpperCase():''; pd.getCell(24).value={formula:'X'+totalRow}; pd.getCell(24).numFmt='_-"Rp"* #,##0_-;-\"Rp\"* #,##0_-;_-\"Rp\"* \"-\"_-;_-@_-';
  ws.views=[{state:'frozen',xSplit:0,ySplit:1}];
}
async function downloadExcelRapi(){
  let filtered=rowsTerfilter(); if(!filtered.length) return alert('Tidak ada data!');
  setProg(50,'Bikin file Excel rapi...');
  let dok=document.getElementById('filterDokter').value;
  let wb=new ExcelJS.Workbook();
  if(dok!=='SEMUA'){
    let r0=filtered[0]; let meta={cabang:String(r0[idx.cabang]||''), docReff:String(r0[idx.docReff]||''), dokter:dok};
    let ws=wb.addWorksheet('Data'); isiSheetRapi(ws, filtered, meta);
  } else {
    let perDokter={}; filtered.forEach(r=>{ let d=String(r[idx.dokter]||'').trim(); if(!perDokter[d]) perDokter[d]=[]; perDokter[d].push(r); });
    // Sheet REKAP dulu
    let wsRekap=wb.addWorksheet('REKAP');
    wsRekap.getRow(1).values=['Dokter','Cabang','Jumlah_Baris','Total_Komisi'];
    wsRekap.getRow(1).font={bold:true}; wsRekap.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}};
    let ri=2;
    Object.keys(perDokter).sort().forEach(d=>{
      let arr=perDokter[d]; let tk=0; arr.forEach(r=>{ tk+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; });
      let r0=arr[0];
      let row=wsRekap.getRow(ri); row.values=[d, String(r0[idx.cabang]||''), arr.length, tk]; row.getCell(4).numFmt='_-"Rp"* #,##0_-'; ri++;
    });
    wsRekap.getColumn(1).width=35; wsRekap.getColumn(2).width=18; wsRekap.getColumn(3).width=14; wsRekap.getColumn(4).width=20;
    // 1 sheet per dokter
    for(let d of Object.keys(perDokter).sort()){
      let arr=perDokter[d]; let r0=arr[0]; let meta={cabang:String(r0[idx.cabang]||''), docReff:String(r0[idx.docReff]||''), dokter:d};
      let sheetName = d.replace(/[\/\\?*\[\]]/g,'-').substring(0,31);
      let ws=wb.addWorksheet(sheetName); isiSheetRapi(ws, arr, meta);
    }
  }
  let buf=await wb.xlsx.writeBuffer();
  let blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=namaFileExcel()+'.xlsx'; a.click(); setProg(100,'Selesai! File Excel ke-download.');
}
async function downloadSatuDokterExcel(dokterNama){
  // Set filter dokter ke dokter ini, lalu download 1 file Excel itu
  document.getElementById('filterDokter').value=dokterNama;
  terapkanFilter();
  await downloadExcelRapi();
}
