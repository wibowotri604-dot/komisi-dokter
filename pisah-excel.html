<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pisah Excel V17 - Sederhana</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
 *{box-sizing:border-box;font-family:Arial,sans-serif} body{margin:0;background:#f4f6f8;padding:12px}
 .card{background:#fff;border-radius:16px;padding:18px;max-width:800px;margin:auto;box-shadow:0 2px 12px rgba(0,0,0,.08)}
 h1{margin:0;font-size:22px;text-align:center} p.sub{color:#666;font-size:13px;text-align:center;margin:6px 0 14px}
 label{font-size:12px;font-weight:bold;display:block;margin-top:12px} select,input{width:100%;padding:12px;margin-top:5px;border:1px solid #ddd;border-radius:9px;font-size:14px;background:#fff}
 .drop{border:2px dashed #2563eb;border-radius:12px;padding:22px;text-align:center;background:#eff6ff;cursor:pointer}
 .btn{width:100%;padding:14px;border:0;border-radius:10px;color:#fff;font-weight:bold;font-size:15px;margin-top:12px;cursor:pointer}
 .btnSmall{padding:8px 12px;border:0;border-radius:8px;color:#fff;font-weight:bold;font-size:12px;cursor:pointer;margin:2px}
 .green{background:#059669}.gray{background:#6b7280}.blue{background:#2563eb}.orange{background:#ea580c}
 .row{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(max-width:600px){.row{grid-template-columns:1fr}}
 .box{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:12px}
 .boxKuning{background:#fffbeb;border:2px solid #fde68a}
 .boxHijau{background:#f0fdf4;border:2px solid #bbf7d0}
 .cekKolom{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #eee;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}
 .cekKolom input{width:auto;margin:0;accent-color:#059669}
 .cekKolom.off{opacity:.45}
 .gridKolom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} @media(max-width:600px){.gridKolom{grid-template-columns:1fr}}
 .bar{height:8px;background:#eee;border-radius:20px;overflow:hidden;margin-top:8px} .bar i{display:block;height:100%;background:#2563eb;width:0%}
 table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px} th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap} th{background:#f8f8f8}
 .step{font-size:16px;font-weight:bold;margin-bottom:4px}
</style>
</head>
<body>
<div class="card">
 <h1>✂️ Pisah Excel Komisi Dokter</h1>
 <p class="sub">Sederhana • Hasil sama seperti V16</p>

 <!-- LANGKAH 1 -->
 <div class="box">
  <div class="step">1. Upload File Gabungan</div>
  <div class="drop" onclick="document.getElementById('file').click()"><div style="font-size:30px">📂</div><div id="fileName"><b>Klik untuk pilih file .xlsx</b></div><div class="bar"><i id="prog"></i></div><small id="statusTxt" style="color:#666"></small></div>
  <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden onchange="bacaFile(event)">
 </div>

 <div id="filterSection" style="display:none">
  <!-- LANGKAH 2 -->
  <div class="box boxHijau">
   <div class="step">2. Pilih Dokter</div>
   <div class="row">
    <div><label>Cabang</label><select id="filterCabang" onchange="onCabangChange(); terapkanFilter()"></select></div>
    <div><label>Bulan</label><select id="filterBulan" onchange="terapkanFilter()"></select></div>
   </div>
   <label>Dokter</label><select id="filterDokter" onchange="terapkanFilter()"></select>
   <label>Cari Dokter</label><input id="cariDokter" placeholder="Ketik nama dokter..." oninput="filterDokterBySearch()">
   <div id="infoTotal" style="margin-top:10px;font-weight:bold;color:#059669"></div>
  </div>

  <!-- LANGKAH 3 -->
  <div class="box boxKuning">
   <div class="step">3. Pilih Kolom yang Mau Di-download</div>
   <div>
    <button class="btnSmall green" onclick="pilihSemuaKolom()">✅ Semua</button>
    <button class="btnSmall gray" onclick="hapusSemuaKolom()">❌ Kosongkan</button>
    <button class="btnSmall blue" onclick="pilihSampaiKomisi()">➡️ Sampai Komisi</button>
    <button class="btnSmall orange" onclick="pilihKolomPenting()">⭐ Penting Saja</button>
   </div>
   <div id="gridKolom" class="gridKolom"></div>
   <div id="kolomTerpilihInfo" style="margin-top:10px;font-size:13px;font-weight:bold;color:#059669"></div>
  </div>

  <!-- DOWNLOAD -->
  <div class="box" style="text-align:center">
   <div id="namaFile" style="font-size:12px;background:#111;color:#0f0;padding:6px 10px;border-radius:6px;display:inline-block"></div>
   <button class="btn green" onclick="downloadExcelRapi()">⬇️ DOWNLOAD EXCEL</button>
   <div style="margin-top:10px;text-align:left"><b>Preview:</b><div style="overflow-x:auto"><table><thead id="headPreview"></thead><tbody id="bodyPreview"></tbody></table></div></div>
  </div>
 </div>
 <p style="text-align:center;color:#999;font-size:11px;margin-top:12px">V17 Sederhana • Hasil sama seperti V16</p>
</div>
<script>
let headers=[], rows=[];
let idx={dokter:-1,cabang:-1,period:-1,komisi:-1,docReff:-1,invoice:-1,transaction:-1};
let allCabang=[], allDokter=[], allBulan=[];
let kolomTerpilih=[];
const KOLOM_AWAL='transaction_date';
const KOLOM_AKHIR='komisi';
function setProg(p,t){document.getElementById('prog').style.width=p+'%';document.getElementById('statusTxt').innerText=t||'';}
const KODE_CABANG={'MAKASSAR':'MKS','MAKASAR':'MKS','PONTIANAK':'PTK','ARTERI':'ARTERI','SINGKAWANG':'SKW','KETAPANG':'KTP'};
function kodeCabang(cabang, invoice){ let c=String(cabang||'').trim().toUpperCase(); if(KODE_CABANG[c]) return KODE_CABANG[c]; let m=String(invoice||'').match(/^[A-Z]-([A-Z]+)-/); if(m) return m[1]; return c.replace(/[^A-Z]/g,'').slice(0,3)||'MKS'; }
function keUnderscore(s){return String(s||'').trim().replace(/['’`]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');}
function bulanInfo(d){ let names=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; let dt=null; if(d instanceof Date) dt=d; else { let s=String(d||'').trim(); let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) dt=new Date(+m[1],+m[2]-1,+m[3]); else { let m2=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m2) dt=new Date(+m2[3],+m2[2]-1,+m2[1]); else dt=new Date(s); } } if(!dt||isNaN(dt)) dt=new Date(); return {bulan:names[dt.getMonth()], tahun2:String(dt.getFullYear()).slice(-2), key:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')}; }
function rangeKolom(){
  let start=headers.findIndex(h=> h.toLowerCase()===KOLOM_AWAL);
  if(start===-1) start=headers.findIndex(h=> h.toLowerCase().includes(KOLOM_AWAL));
  if(start===-1) start=0;
  let end=-1; headers.forEach((h,i)=>{ if(h.toLowerCase()===KOLOM_AKHIR) end=i; });
  if(end===-1) headers.forEach((h,i)=>{ if(h.toLowerCase().includes(KOLOM_AKHIR)) end=i; });
  if(end===-1 || end<start) end=headers.length-1;
  return {start, end};
}
function headersTerpilih(){ if(!kolomTerpilih.length) return headersUtama(); return kolomTerpilih.map(i=> headers[i]); }
function rowsTerpilih(arrRows){ if(!kolomTerpilih.length) return rowsUtama(arrRows); return arrRows.map(r=> kolomTerpilih.map(i=> r[i])); }
function headersUtama(){ let {start,end}=rangeKolom(); return headers.slice(start, end+1); }
function rowsUtama(arrRows){ let {start,end}=rangeKolom(); return arrRows.map(r=> r.slice(start, end+1)); }
function indexKomisiDiTerpilih(){ let h=headersTerpilih(); for(let i=h.length-1;i>=0;i--){ if(h[i].toLowerCase()==='komisi') return i; } return -1; }
function colLetter(n){ let s=''; n++; while(n>0){ let m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function rekapPerDokter(arrRows){
  let map={};
  arrRows.forEach(r=>{
    let d=String(r[idx.dokter]||'').trim()||'Tanpa Dokter';
    if(!map[d]) map[d]={dokter:d, nrp:String(r[idx.docReff]||'').trim(), total:0, count:0};
    if(!map[d].nrp && String(r[idx.docReff]||'').trim()) map[d].nrp=String(r[idx.docReff]||'').trim();
    map[d].total+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; map[d].count++;
  });
  return Object.values(map).sort((a,b)=> a.dokter.localeCompare(b.dokter));
}
function renderPilihKolom(){
  let {start,end}=rangeKolom();
  let listIdx=[]; for(let i=start;i<=end;i++) listIdx.push(i);
  if(!kolomTerpilih.length) kolomTerpilih=[...listIdx];
  let html='';
  listIdx.forEach((idxCol)=>{
    let checked = kolomTerpilih.includes(idxCol) ? 'checked' : '';
    let cls = kolomTerpilih.includes(idxCol) ? '' : 'off';
    html+='<label class="cekKolom '+cls+'" id="cekWrap_'+idxCol+'"><input type="checkbox" '+checked+' onchange="toggleKolom('+idxCol+', this.checked)"> <span>'+headers[idxCol]+'</span></label>';
  });
  document.getElementById('gridKolom').innerHTML=html;
  updateKolomTerpilihInfo();
}
function toggleKolom(idxCol, checked){
  if(checked){ if(!kolomTerpilih.includes(idxCol)) kolomTerpilih.push(idxCol); }
  else { kolomTerpilih=kolomTerpilih.filter(x=> x!==idxCol); }
  kolomTerpilih.sort((a,b)=> a-b);
  let w=document.getElementById('cekWrap_'+idxCol); if(w) w.classList.toggle('off', !checked);
  updateKolomTerpilihInfo(); terapkanFilter();
}
function updateKolomTerpilihInfo(){ document.getElementById('kolomTerpilihInfo').innerText='✅ '+headersTerpilih().length+' kolom terpilih: '+headersTerpilih().join(' | '); }
function pilihSemuaKolom(){ let {start,end}=rangeKolom(); kolomTerpilih=[]; for(let i=start;i<=end;i++) kolomTerpilih.push(i); renderPilihKolom(); terapkanFilter(); }
function hapusSemuaKolom(){ kolomTerpilih=[]; renderPilihKolom(); terapkanFilter(); }
function pilihSampaiKomisi(){ pilihSemuaKolom(); }
function pilihKolomPenting(){
  let target=['transaction_date','branch_name','invoice_number','doctor','doc_reff','item_name','qty_sold','net_sell_price','komisi'];
  let {start,end}=rangeKolom(); kolomTerpilih=[];
  for(let i=start;i<=end;i++){ if(target.includes(headers[i].toLowerCase())) kolomTerpilih.push(i); }
  if(!kolomTerpilih.length) kolomTerpilih=[...Array(end-start+1)].map((_,k)=> start+k);
  renderPilihKolom(); terapkanFilter();
}
function bacaFile(e){
  let f=e.target.files[0]; if(!f) return;
  setProg(10,'Membaca '+f.name+'...'); document.getElementById('fileName').innerHTML='<b>✅ '+f.name+'</b><br><small>Diproses...</small>';
  setTimeout(()=>{
    let r=new FileReader();
    r.onload=function(ev){
      setProg(60,'Mengurai tabel...');
      setTimeout(()=>{
        try{
          let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
          let sheetName = wb.SheetNames.find(n=> n.toLowerCase().trim()==='detail') || wb.SheetNames.find(n=> n.toLowerCase().includes('detail')) || wb.SheetNames.find(n=> n.toLowerCase().includes('mks')) || wb.SheetNames[0];
          let ws=wb.Sheets[sheetName];
          document.getElementById('fileName').innerHTML='<b>✅ '+f.name+'</b><br><small>Sheet: <b>'+sheetName+'</b></small>';
          let aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});
          prosesAOA(aoa);
        }catch(err){ alert('Gagal: '+err.message); }
      },50);
    };
    r.readAsArrayBuffer(f);
  },50);
}
function prosesAOA(aoa){
  let hRow=aoa.findIndex(row=> row.some(c=> String(c).toLowerCase().includes('transaction_date')) && row.some(c=> String(c).toLowerCase().includes('komisi')));
  if(hRow===-1) hRow=aoa.findIndex(row=>row.some(c=>String(c).toLowerCase().includes('doctor')));
  if(hRow===-1) hRow=0;
  headers=aoa[hRow].map((h,i)=> h?String(h).trim():'kolom_'+(i+1));
  let seen={}; headers=headers.map(h=>{ if(seen[h]){seen[h]++; return h+'_'+seen[h];} seen[h]=1; return h; });
  let findIdx=(...names)=> headers.findIndex(h=> names.some(n=> h.toLowerCase().includes(n)));
  idx.dokter=findIdx('doctor'); idx.cabang=findIdx('branch_name'); idx.transaction=findIdx('transaction_date'); idx.period=findIdx('transaction_date'); idx.komisi=headers.length-1; headers.forEach((h,i)=>{ if(h.toLowerCase()==='komisi') idx.komisi=i; }); idx.docReff=findIdx('doc_reff'); idx.invoice=findIdx('invoice_number');
  rows=[];
  for(let i=hRow+1;i<aoa.length;i++){ let vals=aoa[i]; if(!vals || vals.every(v=>String(v||'').trim()==='')) continue; let teks=vals.join(' ').toLowerCase(); if(teks.includes('total komisi')||teks.includes('sum of komisi')) continue; rows.push(vals); }
  kolomTerpilih=[];
  setProg(100,'Selesai! '+rows.length+' baris');
  siapkanFilter();
}
function siapkanFilter(){
  let setCabang=new Set(), setDokter=new Set(), setBulan=new Map();
  rows.forEach(r=>{ let cab=String(r[idx.cabang]||'').trim()||'MAKASSAR'; let dok=String(r[idx.dokter]||'').trim()||'Tanpa Dokter'; let info=bulanInfo(idx.period>=0?r[idx.period]:r[0]); setCabang.add(cab); setDokter.add(dok); setBulan.set(info.key, info.bulan+' 20'+info.tahun2); });
  allCabang=[...setCabang].sort(); allDokter=[...setDokter].sort(); allBulan=[...setBulan.entries()].sort();
  document.getElementById('filterCabang').innerHTML='<option value="SEMUA">Semua Cabang</option>'+allCabang.map(c=>'<option value="'+c.replace(/"/g,'&quot;')+'">'+c+'</option>').join('');
  document.getElementById('filterBulan').innerHTML='<option value="SEMUA">Semua Bulan</option>'+allBulan.map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
  isiDokterDropdown(allDokter);
  document.getElementById('filterSection').style.display='block';
  renderPilihKolom(); terapkanFilter();
}
function isiDokterDropdown(list){ let sel=document.getElementById('filterDokter'); let cur=sel.value; sel.innerHTML='<option value="SEMUA">Semua Dokter ('+list.length+')</option>'+list.map(d=>'<option value="'+d.replace(/"/g,'&quot;')+'">'+d+'</option>').join(''); if(list.includes(cur)) sel.value=cur; }
function onCabangChange(){ let cab=document.getElementById('filterCabang').value; let listDokter = cab==='SEMUA' ? allDokter : [...new Set(rows.filter(r=> String(r[idx.cabang]||'').trim()===cab).map(r=> String(r[idx.dokter]||'').trim()))].sort(); isiDokterDropdown(listDokter); document.getElementById('filterDokter').value='SEMUA'; }
function filterDokterBySearch(){ let q=document.getElementById('cariDokter').value.toLowerCase().trim(); let cab=document.getElementById('filterCabang').value; let base = cab==='SEMUA' ? allDokter : [...new Set(rows.filter(r=> String(r[idx.cabang]||'').trim()===cab).map(r=> String(r[idx.dokter]||'').trim()))].sort(); let filtered = q ? base.filter(d=> d.toLowerCase().includes(q)) : base; isiDokterDropdown(filtered); if(filtered.length===1) document.getElementById('filterDokter').value=filtered[0]; terapkanFilter(); }
function rowsTerfilter(){
  let cab=document.getElementById('filterCabang').value; let dok=document.getElementById('filterDokter').value; let bln=document.getElementById('filterBulan').value;
  return rows.filter(r=>{
    if(cab!=='SEMUA' && String(r[idx.cabang]||'').trim()!==cab) return false;
    if(dok!=='SEMUA' && String(r[idx.dokter]||'').trim()!==dok) return false;
    if(bln!=='SEMUA'){ let info=bulanInfo(idx.period>=0?r[idx.period]:r[0]); if(info.key!==bln) return false; }
    return true;
  });
}
function namaFileExcel(){
  let cab=document.getElementById('filterCabang').value; let dok=document.getElementById('filterDokter').value; let bln=document.getElementById('filterBulan').value;
  let filtered=rowsTerfilter();
  if(dok!=='SEMUA' && filtered.length){ let r0=filtered[0]; let kode=kodeCabang(String(r0[idx.cabang]||'').trim(), r0[idx.invoice]); let info=bulanInfo(idx.period>=0?r0[idx.period]:r0[0]); return 'Komisi_Dokter_'+kode+'_'+info.bulan+'_'+info.tahun2+'_'+keUnderscore(dok); }
  let kode = cab!=='SEMUA' ? kodeCabang(cab,'') : 'Semua_Cabang';
  let blnLabel = bln!=='SEMUA' ? (()=>{ let info=bulanInfo(bln+'-01'); return info.bulan+'_'+info.tahun2; })() : 'Semua_Bulan';
  let dokLabel = dok!=='SEMUA' ? keUnderscore(dok) : 'Semua_Dokter';
  return 'Komisi_Dokter_'+kode+'_'+blnLabel+'_'+dokLabel;
}
function terapkanFilter(){
  updateKolomTerpilihInfo();
  let filtered=rowsTerfilter();
  if(!kolomTerpilih.length){ document.getElementById('infoTotal').innerText='⚠️ Centang minimal 1 kolom.'; document.getElementById('headPreview').innerHTML=''; document.getElementById('bodyPreview').innerHTML=''; return; }
  if(!filtered.length){ document.getElementById('infoTotal').innerText='😢 Tidak ada data.'; return; }
  let totalKomisi=0; filtered.forEach(r=>{ totalKomisi+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; });
  document.getElementById('infoTotal').innerText=filtered.length+' baris • Total Komisi: Rp '+totalKomisi.toLocaleString('id-ID');
  document.getElementById('namaFile').innerText='📄 '+namaFileExcel()+'.xlsx';
  let hU=headersTerpilih(); let rU=rowsTerpilih(filtered);
  document.getElementById('headPreview').innerHTML='<tr>'+hU.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  document.getElementById('bodyPreview').innerHTML=rU.slice(0,5).map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
}
function isiSheetRapi(ws, arrRows){
  let hU=headersTerpilih(); let rU=rowsTerpilih(arrRows);
  let idxKomisi=indexKomisiDiTerpilih();
  let idxTotal = idxKomisi===-1 ? hU.length-1 : idxKomisi;
  let totalKomisi=0; arrRows.forEach(r=>{ totalKomisi+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; });
  hU.forEach((h,i)=>{ ws.getColumn(i+1).width = Math.max(12, Math.min(35, String(h).length+4)); });
  let hr=ws.getRow(1); hU.forEach((h,i)=>{ let c=hr.getCell(i+1); c.value=h; c.font={name:'Calibri',size:11,bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}}; });
  rU.forEach((vals,ri)=>{ let row=ws.getRow(ri+2); vals.forEach((v,ci)=>{ row.getCell(ci+1).value=v; }); if(idxKomisi!==-1) row.getCell(idxKomisi+1).numFmt='_-"Rp"* #,##0_-;-\"Rp\"* #,##0_-;_-\"Rp\"* \"-\"_-;_-@_-'; });
  let lastDataRow=rU.length+1; let totalRowNum=lastDataRow+1;
  let tr=ws.getRow(totalRowNum);
  let cLabel=Math.max(1, idxTotal); let cNilai=idxTotal+1;
  tr.getCell(cLabel).value='Total Komisi'; tr.getCell(cLabel).font={bold:true}; tr.getCell(cLabel).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}};
  tr.getCell(cNilai).value=totalKomisi; tr.getCell(cNilai).numFmt='_-"Rp"* #,##0_-;-\"Rp\"* #,##0_-;_-\"Rp\"* \"-\"_-;_-@_-'; tr.getCell(cNilai).font={bold:true}; tr.getCell(cNilai).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}};
  let rekapHeaderRowNum = totalRowNum + 2;
  let cNRP = Math.max(1, cNilai-2); let cNama = Math.max(1, cNilai-1); let cSum = cNilai;
  let hr2=ws.getRow(rekapHeaderRowNum);
  ws.getColumn(cNama).width = Math.max(ws.getColumn(cNama).width||12, 22);
  ws.getColumn(cNRP).width = Math.max(ws.getColumn(cNRP).width||12, 16);
  [[ 'NRP',cNRP],['DOC NAME 2',cNama],['SUM of komisi',cSum]].forEach(([txt,col])=>{ let c=hr2.getCell(col); c.value=txt; c.font={name:'Calibri',size:11,bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}}; c.border={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}}; });
  let rekap = rekapPerDokter(arrRows);
  rekap.forEach((rk,i)=>{
    let row=ws.getRow(rekapHeaderRowNum+1+i);
    let c1=row.getCell(cNRP); c1.value=rk.nrp; c1.border={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
    let c2=row.getCell(cNama); c2.value=rk.dokter; c2.border={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
    let c3=row.getCell(cSum); c3.value=rk.total; c3.numFmt='_-"Rp"* #,##0_-;-\"Rp\"* #,##0_-;_-\"Rp\"* \"-\"_-;_-@_-'; c3.border={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
  });
  ws.views=[{state:'frozen',xSplit:0,ySplit:1}];
  ws.autoFilter={from:{row:1,column:1}, to:{row:lastDataRow, column:hU.length}};
}
async function downloadExcelRapi(){
  let filtered=rowsTerfilter(); if(!filtered.length) return alert('Tidak ada data!');
  if(!kolomTerpilih.length) return alert('Pilih minimal 1 kolom dulu!');
  setProg(50,'Bikin file Excel...');
  let dok=document.getElementById('filterDokter').value;
  let wb=new ExcelJS.Workbook();
  if(dok!=='SEMUA'){ let ws=wb.addWorksheet('Data'); isiSheetRapi(ws, filtered); }
  else {
    let perDokter={}; filtered.forEach(r=>{ let d=String(r[idx.dokter]||'').trim(); if(!perDokter[d]) perDokter[d]=[]; perDokter[d].push(r); });
    let wsRekap=wb.addWorksheet('REKAP');
    wsRekap.getRow(1).values=['Dokter','Cabang','Jumlah_Baris','Total_Komisi'];
    wsRekap.getRow(1).font={bold:true}; wsRekap.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}};
    let ri=2;
    Object.keys(perDokter).sort().forEach(d=>{ let arr=perDokter[d]; let tk=0; arr.forEach(r=>{ tk+=Number(String(r[idx.komisi]).replace(/[^0-9.-]/g,''))||0; }); let r0=arr[0]; let row=wsRekap.getRow(ri); row.values=[d, String(r0[idx.cabang]||''), arr.length, tk]; row.getCell(4).numFmt='_-"Rp"* #,##0_-'; ri++; });
    wsRekap.getColumn(1).width=35; wsRekap.getColumn(2).width=18; wsRekap.getColumn(3).width=14; wsRekap.getColumn(4).width=20;
    for(let d of Object.keys(perDokter).sort()){ let sheetName = d.replace(/[\/\\?*\[\]]/g,'-').substring(0,31); let ws=wb.addWorksheet(sheetName); isiSheetRapi(ws, perDokter[d]); }
  }
  let buf=await wb.xlsx.writeBuffer();
  let blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=namaFileExcel()+'.xlsx'; a.click(); setProg(100,'Selesai!');
}
</script>
</body>
</html>
